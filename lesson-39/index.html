<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid</title>
    <style>
        .container{
              border: 2px solid black;
              display: grid;
              width: 80vw; 
              height: 100vh;
              grid-template-columns: 120px 100px;
              /* grid-template-rows: 100px 100px 100px; */
              grid-template-rows: 1fr 1fr 1fr; /* 1fr mtlb 1 fraction of the grid*/ 
              /* 3 baar 1fr mtlb 3 tukdo me baat do ise */
              justify-items: center; /*width grid ko centre krta*/ 
              align-items: center; /*height grid ko centre krta*/        }
        .item{
            border:2px solid red;
            height: 55px;
            width: 55px;
           

        }
        .item-4{
            grid-row: 1/2;  /* 1/2 1 line se start dusri pe khtm mtlb ek box agar ye 1/3 hota mtlb 2 box */
            grid-column: 1/2;
        }
        .item-1{
            grid-row: 1/2;
            grid-column: 1/2;
            /* overlap hojayega 1 aur 4 ab */
        }

    </style>
</head>
<body>
    <div class="container">

    <div class="item item-1">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item item-4">4</div>
    <div class="item">5</div>
    </div>
</body>
</html>
<!-- minmax(100px, 1fr) mtlb : 100px: Screen choti hone par tera column 100px par aakar ruk jayega, usse zyada shrink nahi hoga.
 1fr: Jab screen badi hogi aur extra jagah bachegi, toh jitne total fr (tukde) grid mein hain, usme se  
 1 barabar tukda isko mil jayega stretching ke liye. -->

 <!-- grid-template-columns: repeat(4, 100px);
     repeat() ka seedha matlab hai: Ek hi cheez ko baar-baar likhne ki majdoori se bachna.
     Maan le tujhe 4 columns chahiye jo saare 100px ke hon -->

 <!-- grid-template-columns: repeat(3, minmax(100px, 1fr));
      Is ek line ka seedha matlab hai: "3 columns bana, aur har ek column par minmax(100px, 1fr) wala rule laga de. -->
