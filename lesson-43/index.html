<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 7 - CSS Grid Downloads</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            padding: 2rem;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }

        /* 
         * CSS GRID IMPLEMENTATION
         * 3 Columns on desktop, gap of 30px
         */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Card Styling */
        .card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #e34f26; /* Matched to HTML5 Orange */
        }

        .card p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Download Button */
        .download-btn {
            display: inline-block;
            background-color: #e34f26; 
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background-color: #c93e1b;
        }

        /* 
         * RESPONSIVE DESIGN
         * Changes grid to 1 column on phones
         */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Download HTML5 Tools</h1>

    <div class="grid-container">
   
        <div class="card">
           
            <img src="html.png" alt="HTML5 Shield">
            <h2>Windows Version</h2>
            <p>Download the 64-bit installer for Windows 10/11.</p>
            <!-- Local link to trigger a mock download -->
            <a href="html5_windows.exe" class="download-btn">Download</a>
        </div>
        

        <div class="card">
            <img src="html.png" alt="HTML5 Shield">
            <h2>Mac Version</h2>
            <p>Download the DMG file for macOS systems.</p>
            <a href="html5_mac.dmg" class="download-btn">Download</a>
        </div>

   
        <div class="card">
            <img src="html.png" alt="HTML5 Shield">
            <h2>Linux Version</h2>
            <p>Download the Tarball for Linux distributions.</p>
            <a href="html5_linux.tar.gz" class="download-btn">Download</a>
        </div>
    </div>

</body>
</html>
