<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <style>
        button {
            display: flex;
            background-color: rgb(0, 238, 255);
            color: black;
            border: 3px solid black;
            padding: 12px 24px;
            font-size: large;
        }

        .output {
            color: blueviolet;
            font-size: large;
            padding-top: 24px;
            font-weight: bold;}

    .container {
    border: 3px solid #ff0000;
    padding: 20px;}

    </style>
</head>

<body>
    <div class="container">
        <h1>Business name generator</h1>
        <button onclick="generatebusinessname()">Generate Name</button>
        <div class="output">Click Above To Generate</div>
    </div>

    <script>
        function getrandomnum(){
              return Math.floor(Math.random()*3+1);
        }
        function getadjective(){
            let random = getrandomnum();
            if(random == 1){
                return "crazy";
                 }
            else if(random==2){
                return "Amazing";
            }     
            else{
                return "Hot";
            }
        }
        function getshopname(){
          
              let random = getrandomnum();
            if(random == 1){
                return "Engine";
                 }
            else if(random==2){
                return "Printing";
            }     
            else{
                return "Cafe";
            }

        }
        function getshopend(){
          
              let random = getrandomnum();
            if(random == 1){
                return "Limited";
                 }
            else if(random==2){
                return "Boss";
            }     
            else{
                return "bros";
            }

        }
        function generatebusinessname(){
            
            let finalname = getadjective() + " " + getshopname() + " " + getshopend();
            //  document.getElementByID("output").innerText = finalName;     for ID
            document.querySelector(".output").innerText = finalname; //for class 
        }
       
        

    </script>

</body>

</html>
