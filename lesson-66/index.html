    <title>i am a html file </title>
     <style>
        .container{
            border: 2px solid black;
            height: 200px;
        }
    </style>
</head>
<body>
   <div class="container">
   
   </div>
    <script>
     document.body.style.backgroundColor = "yellow";
     document.title = "DOM"

     /* DOM (Document Object Model) kya hai?
        Socho aapka HTML webpage ek ped (tree) ki tarah hai.

        Sabse upar aata hai <html> (Root)

        Uske 2 branches nikalte hain: <head> aur <body>

        <body> ke andar aapke baaki ke tags aate hain jaise <div>, <p>, ya <h1>. */


     /* DOM sirf aapke webpage (HTML content) ko handle karta hai. Lekin browser me aur bhi cheezein hoti hain, jaise current URL dekhna,
      page reload karna, ya screen size pata karna. In sabko control karne ke liye browser hume BOM deta hai   */    
       
    </script>
</body>
